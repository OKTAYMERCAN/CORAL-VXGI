# =====================================================================
#  CORAL VXGI - shaders.properties
# =====================================================================
#  Bu dosya Iris'e şunları söyler:
#    - gereken özellikler ve voxel görüntüsü
#    - oyunun hangi vanilla davranışlarının kapatılacağı
#    - dokuların karışım (blend) ayarları
#    - AYARLAR MENÜSÜNÜN DÜZENİ (hangi ayar hangi sayfada)
#
#  Menü sözdizimi:
#    screen = ...           ana sayfa
#    screen.SAYFA = ...     alt sayfa  ([SAYFA] ile bağlantı verilir)
#    <empty>                boş hücre   <profile>  profil düğmesi
#    sliders = ...          kaydırıcı olarak gösterilecek ayarlar
#  Görünen isimler ve açıklamalar: lang/tr_tr.lang ve lang/en_us.lang
#  "#" ile başlayan satırlar yorumdur. #if satırları ise önişlemcidir.
# =====================================================================

# Voxel ışın izleme için gereken Iris özellikleri
iris.features.required = CUSTOM_IMAGES PER_BUFFER_BLENDING
iris.features.optional = BLOCK_EMISSION_ATTRIBUTE

# 3D voxel ızgarası: isim = sampler biçim içBiçim tip temizle göreli X Y Z
# Boyutlar lib/voxel.glsl içindeki VOXEL_VOLUME ile AYNI olmalı.
#if VOXEL_RANGE == 256
image.voxelImg = voxelSampler RGBA RGBA8 UNSIGNED_BYTE true false 256 128 256
#elif VOXEL_RANGE == 192
image.voxelImg = voxelSampler RGBA RGBA8 UNSIGNED_BYTE true false 192 128 192
#else
image.voxelImg = voxelSampler RGBA RGBA8 UNSIGNED_BYTE true false 128 96 128
#endif

# Blok şekilleri + ışık listesi sahiplenme bayrağı olarak da kullanılır,
# bu yüzden her zaman tanımlıdır (bkz. lib/voxel.glsl)
#if VOXEL_RANGE == 256
image.shapeImg = shapeSampler RED_INTEGER R32UI UNSIGNED_INT true false 256 128 256
#elif VOXEL_RANGE == 192
image.shapeImg = shapeSampler RED_INTEGER R32UI UNSIGNED_INT true false 192 128 192
#else
image.shapeImg = shapeSampler RED_INTEGER R32UI UNSIGNED_INT true false 128 96 128
#endif

# Delikli blokların doku maskesi: blok içinde CUTOUT_MASK_RES^2 ızgara.
# Her voxel için MASK_WORDS adet 32 bitlik kelime yan yana saklanır, bu yüzden
# görüntünün genişliği voxel genişliği x MASK_WORDS kadardır.
# (imageAtomic* yalnızca tek kanallı r32ui formatında çalışır)
#ifdef CUTOUT_SHADOW_MASK
#if CUTOUT_MASK_RES == 16
#if VOXEL_RANGE == 256
image.maskImg = maskSampler RED_INTEGER R32UI UNSIGNED_INT true false 2048 128 256
#elif VOXEL_RANGE == 192
image.maskImg = maskSampler RED_INTEGER R32UI UNSIGNED_INT true false 1536 128 192
#else
image.maskImg = maskSampler RED_INTEGER R32UI UNSIGNED_INT true false 1024 96 128
#endif
#else
#if VOXEL_RANGE == 256
image.maskImg = maskSampler RED_INTEGER R32UI UNSIGNED_INT true false 512 128 256
#elif VOXEL_RANGE == 192
image.maskImg = maskSampler RED_INTEGER R32UI UNSIGNED_INT true false 384 128 192
#else
image.maskImg = maskSampler RED_INTEGER R32UI UNSIGNED_INT true false 256 96 128
#endif
#endif
#endif

# Işık kaynağı listesi: satır 0 = voxel konumu, satır 1 = ışık rengi
#ifdef RT_LIGHTS
image.lightImg = lightSampler RGBA RGBA16F HALF_FLOAT true false 1024 2
image.lightCountImg = lightCountSampler RED_INTEGER R32UI UNSIGNED_INT true false 1 1
#endif

# Oyuncu çevresindeki tüm chunk'ları gölge geçişinde çiz (voxelleştirme için)
shadow.culling = reversed

separateAo = true
clouds = off
oldLighting = false
oldHandLight = false
underwaterOverlay = false
vignette = false
sun = true
moon = true

# G-buffer verileri asla karıştırılmamalı (normal/malzeme bozulur)
blend.gbuffers_terrain.colortex1 = off
blend.gbuffers_terrain.colortex2 = off
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_entities.colortex2 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_hand.colortex2 = off
blend.gbuffers_textured.colortex2 = off
blend.gbuffers_textured_lit.colortex2 = off
blend.gbuffers_basic.colortex2 = off
blend.gbuffers_spidereyes.colortex2 = off
blend.gbuffers_beaconbeam.colortex2 = off
blend.gbuffers_water.colortex5 = off
# Renkli gölgeler: cam rengi shadowcolor0'a karıştırılmadan yazılmalı
blend.shadow.colortex0 = off
blend.gbuffers_hand_water.colortex5 = off

# =====================================================================
#  AYARLAR MENÜSÜ
# =====================================================================
screen = [ABOUT] ABOUT_PERFORMANCE <profile> [RAY_TRACING] [TRANSMISSION] [REFLECTIONS] [LIGHTING] [SHADOWS] [SKY] [WATER] [POST] [DEBUG]
screen.columns = 2

screen.ABOUT = ABOUT_PACK ABOUT_VERSION ABOUT_AUTHOR ABOUT_CONTACT ABOUT_WEBSITE ABOUT_LICENSE ABOUT_THANKS ABOUT_REQUIREMENTS
screen.ABOUT.columns = 1

screen.RAY_TRACING = RT_LIGHTS RT_LIGHT_STRENGTH RT_LIGHT_SAMPLES RT_LIGHT_RANGE RT_LIGHT_FALLOFF RT_LIGHT_SIZE REFLECTION_BLOCK_LIGHT <empty> <empty> <empty> GI_ENABLED GI_BOUNCES GI_STRENGTH GI_SATURATION VOXEL_RANGE GI_MAX_STEPS GI_MAX_DISTANCE EMISSION_STRENGTH GI_SKY_STRENGTH GI_SUN_BOUNCE GI_HIT_AMBIENT GI_FIREFLY_CLAMP <empty> <empty> VOXEL_SHAPES VOXELIZE_LEAVES AUTO_EMITTERS VOXELIZE_TRANSLUCENT_EMITTERS CUTOUT_SHADOW_MASK CUTOUT_MASK_RES EMISSION_SHAPE_BOOST EMISSION_SHAPE_BOOST_MAX <empty> <empty> [GI_DENOISER] [EMISSION_COLORS]
screen.GI_DENOISER = GI_DENOISE_SAMPLES GI_TEMPORAL_FRAMES GI_TEMPORAL_DEPTH_TOLERANCE GI_DENOISE <empty> GI_DENOISE_RADIUS GI_DENOISE_MIN_RADIUS GI_DENOISE_NORMAL_WEIGHT
screen.EMISSION_COLORS = EMIT_FIRE_R EMIT_FIRE_G EMIT_FIRE_B EMIT_FIRE_I \
    EMIT_SOUL_R EMIT_SOUL_G EMIT_SOUL_B EMIT_SOUL_I \
    EMIT_LAMP_R EMIT_LAMP_G EMIT_LAMP_B EMIT_LAMP_I \
    EMIT_LAVA_R EMIT_LAVA_G EMIT_LAVA_B EMIT_LAVA_I \
    EMIT_REDSTONE_R EMIT_REDSTONE_G EMIT_REDSTONE_B EMIT_REDSTONE_I \
    EMIT_COOL_R EMIT_COOL_G EMIT_COOL_B EMIT_COOL_I \
    EMIT_PURPLE_R EMIT_PURPLE_G EMIT_PURPLE_B EMIT_PURPLE_I \
    EMIT_GREEN_R EMIT_GREEN_G EMIT_GREEN_B EMIT_GREEN_I \
    EMIT_TINTED_I EMIT_TINTED_SAT <empty> <empty> \
    EMIT_CUSTOM_I EMIT_CONCRETE_POWDER EMIT_CONCRETE EMIT_WOOL \
    EMIT_MINERAL_BLOCKS
screen.EMISSION_COLORS.columns = 4

screen.TRANSMISSION = COLORED_SHADOWS SHADOW_TINT_BRIGHTNESS GLASS_TRANSMISSION GLASS_TINT_STRENGTH TRANSMISSION_FROM_ALPHA
screen.TRANSMISSION.columns = 1

screen.REFLECTIONS = RT_REFLECTIONS REFLECTION_SCREEN_LOOKUP REFLECTION_STEPS REFLECTION_MAX_DISTANCE SSR_FALLBACK <empty> SSR_MAX_STEPS SSR_THICKNESS <empty> <empty> \
    WATER_REFLECTIONS GLASS_REFLECTIONS GLASS_REFLECTION_STRENGTH GLASS_REFRACTION GLASS_REFRACTION_STRENGTH GLASS_REFRACTION_DEPTH BLOCK_REFLECTIONS POLISHED_SMOOTHNESS METAL_SMOOTHNESS REFLECTION_MIN_SMOOTHNESS ROUGH_REFLECTION_JITTER <empty> <empty> \
    SUN_SPECULAR LABPBR LABPBR_EMISSION

screen.LIGHTING = SUN_BRIGHTNESS MOON_BRIGHTNESS SKY_BRIGHTNESS MIN_LIGHT <empty> <empty> \
    BLOCKLIGHT_STRENGTH BLOCKLIGHT_CURVE LIGHTMAP_RT_BLEND [BLOCKLIGHT_COLOR] <empty> <empty> \
    HAND_LIGHT HAND_LIGHT_STRENGTH HAND_LIGHT_RANGE FOLIAGE_TRANSLUCENCY LEAK_FIX <empty> <empty> NETHER_AMBIENT END_AMBIENT
screen.BLOCKLIGHT_COLOR = BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B
screen.BLOCKLIGHT_COLOR.columns = 1

screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES SHADOW_DISTORTION SHADOW_BIAS sunPathRotation SHADOW_EDGE_FADE

screen.SKY = SUN_DISC SUN_DISC_SIZE SUN_DISC_BRIGHTNESS SUNSET_STRENGTH STARS_BRIGHTNESS MOON_TEXTURE_BRIGHTNESS <empty> <empty> \
    CLOUDS CLOUD_HEIGHT CLOUD_AMOUNT CLOUD_SPEED CLOUD_SCALE <empty> <empty> <empty> \
    FOG FOG_DENSITY BORDER_FOG BORDER_FOG_START RAIN_DARKNESS

screen.WATER = WATER_WAVES WATER_WAVE_STRENGTH WATER_WAVE_SPEED WATER_WAVE_SCALE <empty> <empty> WATER_REFRACTION WATER_REFRACTION_STRENGTH WATER_ABSORPTION WATER_SCATTER WATER_SURFACE_OPACITY WATER_SUN_SPECULAR <empty> <empty> WATER_CAUSTICS CAUSTICS_STRENGTH CAUSTICS_SCALE CAUSTICS_SPEED <empty> <empty> UNDERWATER_FOG_DENSITY UNDERWATER_BIOME_TINT

screen.POST = BLOOM BLOOM_STRENGTH EXPOSURE AUTO_EXPOSURE CAVE_EXPOSURE NIGHT_EXPOSURE TONEMAP <empty> SATURATION CONTRAST VIGNETTE_STRENGTH DITHERING

screen.DEBUG = DEBUG_VIEW ABOUT_DEBUG_HELP DEBUG_SPLIT DEBUG_NAN_CHECK DEBUG_SHADOW_OVERLAY DEBUG_FREEZE_NOISE <empty> DEBUG_HELP_GBUFFER DEBUG_HELP_GI DEBUG_HELP_LIGHT DEBUG_HELP_VOXEL DEBUG_HELP_TOOLS
screen.DEBUG.columns = 1

# Kaydırıcı olarak gösterilecek sayısal ayarlar
sliders = GI_MAX_STEPS GI_MAX_DISTANCE GI_STRENGTH GI_SKY_STRENGTH GI_SUN_BOUNCE GI_HIT_AMBIENT GI_FIREFLY_CLAMP \
    GI_TEMPORAL_FRAMES GI_TEMPORAL_DEPTH_TOLERANCE GI_DENOISE_RADIUS GI_DENOISE_MIN_RADIUS GI_DENOISE_NORMAL_WEIGHT \
    VOXEL_RANGE EMISSION_STRENGTH EMISSION_SHAPE_BOOST EMISSION_SHAPE_BOOST_MAX EMIT_TINTED_I EMIT_TINTED_SAT \
    GI_BOUNCES GI_SATURATION EMIT_CUSTOM_I GLASS_TINT_STRENGTH SHADOW_TINT_BRIGHTNESS \
    RT_LIGHT_SAMPLES RT_LIGHT_STRENGTH RT_LIGHT_RANGE RT_LIGHT_FALLOFF RT_LIGHT_SIZE CUTOUT_MASK_RES GI_DENOISE_SAMPLES \
    EMIT_FIRE_R EMIT_FIRE_G EMIT_FIRE_B EMIT_FIRE_I EMIT_SOUL_R EMIT_SOUL_G EMIT_SOUL_B EMIT_SOUL_I \
    EMIT_LAMP_R EMIT_LAMP_G EMIT_LAMP_B EMIT_LAMP_I EMIT_LAVA_R EMIT_LAVA_G EMIT_LAVA_B EMIT_LAVA_I \
    EMIT_REDSTONE_R EMIT_REDSTONE_G EMIT_REDSTONE_B EMIT_REDSTONE_I EMIT_COOL_R EMIT_COOL_G EMIT_COOL_B EMIT_COOL_I \
    EMIT_PURPLE_R EMIT_PURPLE_G EMIT_PURPLE_B EMIT_PURPLE_I EMIT_GREEN_R EMIT_GREEN_G EMIT_GREEN_B EMIT_GREEN_I \
    REFLECTION_STEPS REFLECTION_MAX_DISTANCE SSR_MAX_STEPS SSR_THICKNESS GLASS_REFLECTION_STRENGTH GLASS_REFRACTION_STRENGTH GLASS_REFRACTION_DEPTH \
    POLISHED_SMOOTHNESS METAL_SMOOTHNESS REFLECTION_MIN_SMOOTHNESS ROUGH_REFLECTION_JITTER \
    SUN_BRIGHTNESS MOON_BRIGHTNESS SKY_BRIGHTNESS MIN_LIGHT BLOCKLIGHT_STRENGTH BLOCKLIGHT_R BLOCKLIGHT_G BLOCKLIGHT_B \
    BLOCKLIGHT_CURVE LIGHTMAP_RT_BLEND HAND_LIGHT_STRENGTH HAND_LIGHT_RANGE NETHER_AMBIENT END_AMBIENT \
    shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES SHADOW_DISTORTION SHADOW_BIAS sunPathRotation \
    SUN_DISC_SIZE SUN_DISC_BRIGHTNESS SUNSET_STRENGTH STARS_BRIGHTNESS MOON_TEXTURE_BRIGHTNESS \
