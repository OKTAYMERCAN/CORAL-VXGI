# Hazır profiller (yalnızca performansı etkileyen ayarlar)
profile.LOW    = RT_LIGHT_SAMPLES=4 GI_BOUNCES=1 GI_MAX_STEPS=24 REFLECTION_STEPS=48  shadowMapResolution=1024 VOXEL_RANGE=128 !SSR_FALLBACK SHADOW_SAMPLES=4  VOXEL_SHAPES
profile.MEDIUM = GI_BOUNCES=2 GI_MAX_STEPS=48 REFLECTION_STEPS=96  shadowMapResolution=2048 VOXEL_RANGE=128 SSR_FALLBACK  SHADOW_SAMPLES=12
profile.HIGH   = GI_BOUNCES=2 GI_MAX_STEPS=64 REFLECTION_STEPS=128 shadowMapResolution=3072 VOXEL_RANGE=192 SSR_FALLBACK  SHADOW_SAMPLES=12
profile.ULTRA  = GI_BOUNCES=3 GI_MAX_STEPS=96 REFLECTION_STEPS=192 shadowMapResolution=4096 VOXEL_RANGE=256 SSR_FALLBACK  SHADOW_SAMPLES=12
